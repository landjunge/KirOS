[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kiros"
version = "0.1.0"
description = "OpenRouter terminal client built on the KiraBridge adapter"
requires-python = ">=3.11"
dependencies = ["kirabridge==0.8.0rc81"]

[project.scripts]
kiros = "kiros.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.uv.sources]
kirabridge = { git = "https://github.com/landjunge/KiraBridge.git", rev = "79bfc753bd149c97c1c972c48b4a70f4197cbc44" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
ignore = ["ASYNC109", "ASYNC240"]
